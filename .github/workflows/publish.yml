name: Publish Package

# main -> prod hub (token minted from AUX4_PUBLISHER_* client credentials against
#         prod SSO; default registry)
# dev  -> dev hub  (token minted from AUX4_DEV_PUBLISHER_* client credentials
#         against dev SSO, since the dev hub validates against dev SSO; registry
#         pointed at the dev hub). Both paths call aux4/action@v1 command:publish;
#         only the token + registry differ (the SFA-039 dev/prod pattern, mirrors
#         packages/agent-manager and packages/cloud).
on:
  push:
    branches:
      - main
      - dev
    paths:
      - '**'
      - '!.github/**'
      - '!README.md'
      - '!LICENSE'
      - '!.gitignore'

  workflow_dispatch:
    inputs:
      level:
        description: 'Release level (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: publish-package-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      # aux4/cloud-remote (the relay this test suite depends on) is cloud-dev-only
      # and not yet on the prod hub. Install it from the dev hub first, scoped to
      # just this command, before test-package-action's own bootstrap runs (which
      # must stay on the default/prod hub, or its own pkger/jest install breaks).
      # Resolve its dependency chain (aux4/api -> aux4/oauth -> aux4/curl, etc.)
      # from the default/prod hub FIRST - they are ordinary prod-hub packages,
      # and the dev hub's mirror of them can go stale (see the darwin job's
      # comment / RMT-013) - then install only the cloud-remote leaf from dev.
      - name: Install aux4/cloud-remote test dependency from dev hub
        if: github.ref_name == 'dev'
        shell: bash
        run: |
          curl -fsSL https://aux4.sh | sh
          export PATH="$HOME/.aux4.config/packages/aux4/aux4:$PATH"
          curl -fsSL https://pkger.aux4.sh | sh
          aux4 aux4 pkger install aux4/api
          AUX4_REGISTRY_URL=https://dev.api.hub.aux4.io/v1/packages aux4 aux4 pkger install aux4/cloud-remote

      # The end-to-end suite runs a real "aux4 todo" command through an
      # allowed expose glob (remote.test.md: "should allow a command matched
      # only by a broad allow glob") to prove an allowed command actually
      # executes, not just that the daemon tries to run it. aux4/todo is not
      # one of this package's own dependencies (the daemon execs whatever
      # aux4 command the caller asks for, it does not declare what that
      # could be), so it has to be provisioned for the test job explicitly -
      # a clean CI runner does not have it.
      - name: Test
        uses: aux4/test-package-action@v1
        with:
          build_command: aux4 builder linux
          packages: ${{ github.ref_name == 'dev' && 'aux4/todo' || 'aux4/todo aux4/cloud-remote' }}

  test-darwin:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      # aux4/cloud-remote (the relay this test suite depends on) is cloud-dev-only
      # and not yet on the prod hub, so it has to come from the dev hub - but
      # ONLY it: its own dependency chain (aux4/api -> aux4/oauth -> aux4/curl
      # -> aux4/config, aux4/secret) is made of ordinary packages that already
      # live on the default/prod hub, kept current there. The dev hub mirrors
      # packages on-demand and had gone stale for aux4/curl (missing a
      # darwin_arm64 build), which made pkger fail every dependency in the
      # chain with "not compatible with your platform" on macos-latest
      # (Apple Silicon) runners the moment AUX4_REGISTRY_URL pointed the WHOLE
      # install - leaf package AND every transitive dependency - at the dev
      # hub (RMT-013). Confirmed on a real darwin_arm64 machine: the prod hub's
      # aux4/curl installs cleanly; only the dev hub copy was behind.
      #
      # Fix: resolve the dependency chain from the default (prod) hub first,
      # with no AUX4_REGISTRY_URL override, then install only the
      # aux4/cloud-remote leaf from the dev hub - pkger finds its
      # already-installed dependencies satisfied locally and never re-resolves
      # them from the dev hub at all.
      - name: Install aux4/cloud-remote test dependency from dev hub
        if: github.ref_name == 'dev'
        shell: bash
        run: |
          curl -fsSL https://aux4.sh | sh
          export PATH="$HOME/.aux4.config/packages/aux4/aux4:$PATH"
          curl -fsSL https://pkger.aux4.sh | sh
          aux4 aux4 pkger install aux4/api
          AUX4_REGISTRY_URL=https://dev.api.hub.aux4.io/v1/packages aux4 aux4 pkger install aux4/cloud-remote

      - name: Test
        uses: aux4/test-package-action@v1
        with:
          build_command: aux4 builder darwin
          packages: ${{ github.ref_name == 'dev' && 'aux4/todo' || 'aux4/todo aux4/cloud-remote' }}

  publish:
    needs: [test-linux, test-darwin]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Build
        run: |
          GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w" -trimpath -o package/dist/darwin/amd64/aux4-remote .
          GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w" -trimpath -o package/dist/darwin/arm64/aux4-remote .
          GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -trimpath -o package/dist/linux/amd64/aux4-remote .
          GOOS=linux GOARCH=arm64 go build -ldflags "-s -w" -trimpath -o package/dist/linux/arm64/aux4-remote .
          GOOS=linux GOARCH=386 go build -ldflags "-s -w" -trimpath -o package/dist/linux/386/aux4-remote .
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -trimpath -o package/dist/windows/amd64/aux4-remote.exe .
          GOOS=windows GOARCH=arm64 go build -ldflags "-s -w" -trimpath -o package/dist/windows/arm64/aux4-remote.exe .
          GOOS=windows GOARCH=386 go build -ldflags "-s -w" -trimpath -o package/dist/windows/386/aux4-remote.exe .

      - name: Mint prod hub publish token
        id: mint
        if: github.ref_name == 'main'
        env:
          CLIENT_ID: ${{ secrets.AUX4_PUBLISHER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AUX4_PUBLISHER_CLIENT_SECRET }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then echo "::error::publisher client id/secret not set"; exit 1; fi
          TOK=$(curl -sf -u "$CLIENT_ID:$CLIENT_SECRET" -d grant_type=client_credentials https://sso.aux4.io/token | jq -r '.access_token // empty')
          if [ -z "$TOK" ]; then echo "::error::client_credentials mint returned no access_token"; exit 1; fi
          echo "::add-mask::$TOK"; echo "token=$TOK" >> "$GITHUB_OUTPUT"

      # The dev hub is validated by dev SSO, so a prod token is rejected there.
      # Mint a short-lived dev publish token from the dev publisher client
      # credentials. Only runs on the dev branch.
      - name: Mint dev hub publish token
        id: devmint
        if: github.ref_name == 'dev'
        env:
          CLIENT_ID: ${{ secrets.AUX4_DEV_PUBLISHER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AUX4_DEV_PUBLISHER_CLIENT_SECRET }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then echo "::error::dev publisher client id/secret not set"; exit 1; fi
          TOK=$(curl -sf -u "$CLIENT_ID:$CLIENT_SECRET" -d grant_type=client_credentials https://dev.sso.aux4.io/token | jq -r '.access_token // empty')
          if [ -z "$TOK" ]; then echo "::error::client_credentials mint returned no access_token from dev SSO"; exit 1; fi
          echo "::add-mask::$TOK"; echo "token=$TOK" >> "$GITHUB_OUTPUT"

      - name: Publish package
        uses: aux4/action@v1
        with:
          command: publish
          level: ${{ inputs.level || 'patch' }}
          # dev -> minted dev token; main -> minted prod token
          aux4_token: ${{ github.ref_name == 'dev' && steps.devmint.outputs.token || steps.mint.outputs.token }}
          # dev -> dev hub registry; main -> default (prod) hub
          registry: ${{ github.ref_name == 'dev' && 'https://dev.api.hub.aux4.io/v1/packages' || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
